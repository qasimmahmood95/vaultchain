# Advisory test-review gate (PRD §D.3) — a DOCUMENTED PATTERN, not a merge gate.
#
# When a pull request touches `tests/**`, this runs one of the repo's reviewer
# agents over the diff and posts its findings as a PR comment. It is deliberately
# **advisory / non-blocking**:
#
#   • `continue-on-error: true` and no required-status registration, so a review
#     that flags something NEVER blocks merge.
#   • The honest position (README §7): an LLM reviewer is a strong *signal*, not
#     an authority — this workflow demonstrates the pattern of wiring the repo's
#     `.claude/agents` panel into CI, it does not claim an LLM should gate merges
#     unattended.
#
# To PROMOTE it to a required check once a team trusts the signal: drop
# `continue-on-error`, have the step exit non-zero on findings above a chosen
# severity, and add "review" to the branch-protection required checks. That is a
# deliberate, reversible decision — left un-taken here on purpose.
#
# Requires an ANTHROPIC_API_KEY repo secret; the job no-ops if it is absent, so a
# fork without the secret still passes.

name: review (advisory)

on:
  pull_request:
    paths:
      - "tests/**"
      - ".claude/agents/**"

# Least privilege: read the code, write PR comments — nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  test-review:
    name: adversarial test review (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking: this job's conclusion must never fail the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the agent can diff against the base

      - name: Skip if no API key
        id: guard
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping the advisory review."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs the assertion-critic / flake-hunter charter (from .claude/agents/)
      # over the PR diff and posts a summary comment. Pinned by major version.
      - name: Run reviewer agent on the diff
        if: ${{ steps.guard.outputs.run == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Point the action at the repo's own panel rather than an ad-hoc prompt,
          # so CI review and local pre-PR review use the SAME charters.
          prompt: >
            You are the assertion-critic and flake-hunter from .claude/agents/.
            Review only the changed files under tests/** in this pull request.
            For each finding give file:line, severity, why it matters, and a
            direction. Post a single ranked summary comment. Do not modify files.
          claude_args: "--max-turns 12"
